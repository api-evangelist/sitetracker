source: >-
  https://www.sitetracker.com/ sitemap (542 pages enumerated);
  live probes of status./release-notes/changelog paths
note: >-
  Sitetracker publishes no versioning policy, no deprecation policy, no
  Sunset/Deprecation header commitment, no SLA page and no status page of its
  own. status.sitetracker.com does not resolve (NXDOMAIN). Because the product
  is a Salesforce managed package, the runtime availability signal customers
  actually watch is Salesforce Trust (status.salesforce.com) — Salesforce's page,
  not Sitetracker's, so NO `StatusPage` pointer is emitted on Sitetracker's
  behalf. Likewise the API version in the base URL is the Salesforce Platform API
  version, governed by Salesforce's own three-year-release deprecation policy,
  not by anything Sitetracker publishes. Release notes for the managed package
  exist inside the gated Salesforce Community help center and were not reachable.
