aid: sitetracker
name: Sitetracker
description: 'Sitetracker is a global software company whose deployment operations
  management platform is built natively on Salesforce, used to plan, build, operate
  and maintain critical infrastructure at scale — fiber and wireless networks, towers,
  data centers, space and satellite, utilities, renewable energy, battery storage
  and EV charging. The product set spans Project Management, Financial Management,
  Agreement Management, Field Work Management, Site & Asset Management, Reporting
  & Analytics, Sitetracker GIS Link, Sitetracker Mobile and the Scout AI assistant.
  Because the platform is a Salesforce managed package, its programmable surface is
  the Salesforce Platform API — Sitetracker states that its standard and custom objects
  are API-ready and reachable over REST, SOAP and Bulk APIs, called against each customer''s
  own Salesforce org rather than a Sitetracker-operated API host. Sitetracker publishes
  no public developer portal, API reference or machine-readable contract; the object
  and integration documentation sits behind a Salesforce Community login.'
