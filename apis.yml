apis:
- name: Sitetracker Platform API
  description: 'Sitetracker''s programmable surface is the Salesforce Platform API
    over the Sitetracker managed package''s standard and custom objects. Sitetracker
    states: "You can build apps, automations, and integrations using REST, SOAP, Bulk,
    and other APIs—with full support for custom and standard objects" and "Sitetracker
    objects are API-ready and work seamlessly with standard Salesforce connectors and
    tools." There is no Sitetracker-operated API host: calls are made against the customer''s
    own Salesforce org domain, so the base URL is templated per tenant. Sitetracker
    publishes no OpenAPI, no public API reference and no developer portal.'
